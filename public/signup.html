<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | OrthoNow Patient Portals</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-hover: #115e59;
      --primary-light: #ccfbf1;
      --secondary: #0f172a;
      --text: #334155;
      --text-light: #64748b;
      --bg: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --error: #ef4444;
      --success: #22c55e;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .auth-card {
      background-color: var(--white);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      text-decoration: none;
      color: var(--primary);
      font-weight: 800;
      font-size: 1.35rem;
    }

    .logo-icon { width: 1.5rem; height: 1.5rem; fill: currentColor; }

    .title { font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 0.5rem; }
    .subtitle { font-size: 0.875rem; color: var(--text-light); text-align: center; margin-bottom: 2rem; }

    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 1.5rem 0;
      font-size: 0.875rem;
      color: var(--text);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary);
      color: var(--white);
      border: none;
      padding: 0.875rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-submit:hover { background-color: var(--primary-hover); }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      display: none;
    }
    .alert-error { background-color: #fef2f2; color: var(--error); border: 1px solid #fee2e2; }

    .footer-text {
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-light);
      margin-top: 1.5rem;
    }
    .footer-text a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .footer-text a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-card">
    <a href="/" class="logo-container">
      <svg class="logo-icon" viewBox="0 0 24 24">
        <path d="M19 10.5V6c0-1.1-.9-2-2-2H7c-1.1 0-2 .9-2 2v4.5C3 11.25 3 13 5 13.5V18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-4.5c2-.5 2-2.25 0-3zM12 6.5c1.38 0 2.5 1.12 2.5 2.5s-1.12 2.5-2.5 2.5-2.5-1.12-2.5-2.5 1.12-2.5 2.5-2.5zM15 18H9v-1.5c0-1 2-1.5 3-1.5s3 .5 3 1.5V18z"/>
      </svg>
      OrthoNow
    </a>

    <h2 class="title">Create Account</h2>
    <p class="subtitle">Sign up to access patient portals and integration services.</p>

    <div class="alert alert-error" id="error-alert"></div>

    <form id="signup-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" minlength="6">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="role-admin">
        <label for="role-admin">Register as Administrator (Admin role)</label>
      </div>

      <button type="submit" class="btn-submit">Register Account</button>
    </form>

    <p class="footer-text">Already have an account? <a href="/login">Log In</a></p>
  </div>

  <script>
    document.getElementById("signup-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const isAdmin = document.getElementById("role-admin").checked;
      const errorAlert = document.getElementById("error-alert");

      errorAlert.style.display = "none";

      fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email,
          password: password,
          role: isAdmin ? 'admin' : 'user'
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          // Redirect to verify OTP page with email parameter
          window.location.href = `/verify-otp?email=${encodeURIComponent(email)}`;
        } else {
          errorAlert.textContent = data.error || 'Signup failed.';
          errorAlert.style.display = "block";
        }
      })
      .catch(err => {
        errorAlert.textContent = 'Network error: Failed to reach auth server.';
        errorAlert.style.display = "block";
      });
    });
  </script>
</body>
</html>
