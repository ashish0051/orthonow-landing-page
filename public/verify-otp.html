<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification | OrthoNow Patient Portals</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-hover: #115e59;
      --primary-light: #ccfbf1;
      --secondary: #0f172a;
      --text: #334155;
      --text-light: #64748b;
      --bg: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --error: #ef4444;
      --success: #22c55e;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .auth-card {
      background-color: var(--white);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      text-decoration: none;
      color: var(--primary);
      font-weight: 800;
      font-size: 1.35rem;
    }

    .logo-icon { width: 1.5rem; height: 1.5rem; fill: currentColor; }

    .title { font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 0.5rem; }
    .subtitle { font-size: 0.875rem; color: var(--text-light); text-align: center; margin-bottom: 2rem; }

    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; text-align: center; }
    
    .otp-inputs {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    
    .otp-input {
      width: 3.25rem;
      height: 3.75rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      border: 1.5px solid #cbd5e1;
      border-radius: 0.5rem;
      background-color: var(--bg);
    }
    
    .otp-input:focus {
      outline: none;
      border-color: var(--primary);
      background-color: var(--white);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary);
      color: var(--white);
      border: none;
      padding: 0.875rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-submit:hover { background-color: var(--primary-hover); }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      display: none;
      text-align: center;
    }
    .alert-error { background-color: #fef2f2; color: var(--error); border: 1px solid #fee2e2; }
    .alert-success { background-color: #f0fdf4; color: var(--success); border: 1px solid #dcfce7; }

    .footer-text {
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-light);
      margin-top: 1.5rem;
    }
    .footer-text a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .footer-text a:hover { text-decoration: underline; }

    .dev-hint {
      margin-top: 1.5rem;
      padding: 0.75rem;
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <a href="/" class="logo-container">
      <svg class="logo-icon" viewBox="0 0 24 24">
        <path d="M19 10.5V6c0-1.1-.9-2-2-2H7c-1.1 0-2 .9-2 2v4.5C3 11.25 3 13 5 13.5V18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-4.5c2-.5 2-2.25 0-3zM12 6.5c1.38 0 2.5 1.12 2.5 2.5s-1.12 2.5-2.5 2.5-2.5-1.12-2.5-2.5 1.12-2.5 2.5-2.5zM15 18H9v-1.5c0-1 2-1.5 3-1.5s3 .5 3 1.5V18z"/>
      </svg>
      OrthoNow
    </a>

    <h2 class="title">Verify OTP</h2>
    <p class="subtitle" id="verification-subtitle">Please enter the verification code sent to your email.</p>

    <div class="alert alert-error" id="error-alert"></div>
    <div class="alert alert-success" id="success-alert"></div>

    <form id="otp-form">
      <div class="form-group">
        <label>Enter 6-Digit Code</label>
        <div class="otp-inputs">
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required autofocus>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">Verify & Activate</button>
    </form>

    <p class="footer-text">Didn't receive code? <a href="#" id="resend-link">Resend</a></p>

    <div class="dev-hint">
      <strong>💡 Developer Instruction:</strong> If SMTP is not set up on your server environment, check the backend node console logs or terminal output to retrieve the active 6-digit OTP code.
    </div>
  </div>

  <script>
    // Extract email from query parameters
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email') || '';
    
    if (email) {
      document.getElementById('verification-subtitle').innerHTML = `We sent a 6-digit security code to <br><strong>${escapeHtml(email)}</strong>.`;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Handle digit jumping behavior in inputs
    const inputs = document.querySelectorAll('.otp-input');
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (input.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    document.getElementById("otp-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const errorAlert = document.getElementById("error-alert");
      const successAlert = document.getElementById("success-alert");

      errorAlert.style.display = "none";
      successAlert.style.display = "none";

      // Combine input digits
      let otpCode = '';
      inputs.forEach(input => {
        otpCode += input.value;
      });

      fetch('/api/auth/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email,
          otp: otpCode
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          successAlert.textContent = data.message || 'Verification successful!';
          successAlert.style.display = "block";
          setTimeout(() => {
            window.location.href = '/login';
          }, 1500);
        } else {
          errorAlert.textContent = data.error || 'Invalid OTP code.';
          errorAlert.style.display = "block";
        }
      })
      .catch(err => {
        errorAlert.textContent = 'Network error: Failed to connect to verification server.';
        errorAlert.style.display = "block";
      });
    });
  </script>
</body>
</html>
